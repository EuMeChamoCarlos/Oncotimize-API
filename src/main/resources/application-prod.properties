# Profile prod (Render): nenhuma credencial aqui, tudo vem de variáveis de ambiente.
# Variáveis: DB_URL (formato jdbc:postgresql://host:5432/banco), DB_USERNAME, DB_PASSWORD,
# JWT_SECRET, CORS_ALLOWED_ORIGINS (URL do front publicado, separadas por vírgula).
# Para a demonstração com dados sintéticos, ativar junto o dev: SPRING_PROFILES_ACTIVE=prod,dev
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Nunca update em produção: o schema só muda pelas migrações do Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
